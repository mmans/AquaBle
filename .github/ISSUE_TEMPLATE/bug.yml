name: Bug report
description: Something does not work as expected.
labels: ["bug", "status:draft"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: input
    id: device
    attributes:
      label: Device model and firmware version
      placeholder: "e.g. WRGB II Pro, firmware v24"
  - type: input
    id: version
    attributes:
      label: AquaBle version / commit
  - type: textarea
    id: logs
    attributes:
      label: Logs / BLE payloads
      description: Relevant `custom_components.aquable` debug logs or raw frames.
      render: text
